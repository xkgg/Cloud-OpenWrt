name: Build OpenWrt x86_64 (ImageBuilder)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version (官方发行版本号)'
        required: true
        default: '24.10.8'
      custom_packages:
        description: 'Custom Packages (自定义软件包，空格分隔)'
        required: false
        default: >-
          base-files block-mount ca-bundle -dnsmasq dnsmasq-full dropbear fdisk firewall4
          fstools grub2-bios-setup i915-firmware-dmc kmod-8139cp kmod-8139too
          kmod-button-hotplug kmod-e1000e kmod-fs-f2fs kmod-i40e kmod-igb
          kmod-igbvf kmod-igc kmod-ixgbe kmod-ixgbevf kmod-nf-nathelper
          kmod-nf-nathelper-extra kmod-nft-offload kmod-pcnet32 kmod-tulip kmod-usb-hid kmod-usb-net
          kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150
          kmod-usb-net-rtl8152 kmod-vmxnet3 libc libgcc -libustream-mbedtls libustream-openssl logd
          luci-app-package-manager luci-compat luci-lib-base luci-lib-ipkg
          luci-light mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only opkg
          partx-utils ppp ppp-mod-pppoe procd-ujail uci uclient-fetch
          urandom-seed urngd kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 kmod-e1000
          kmod-dwmac-intel kmod-forcedeth kmod-fs-vfat kmod-tg3 kmod-drm-i915

env:
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Initialize Environment
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          sudo -E apt-get update -qq
          sudo -E apt-get -y install \
            wget curl zstd xz-utils dosfstools mtools qemu-utils \
            libncurses5-dev libncursesw5-dev

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Download Official ImageBuilder
        run: |
          VERSION="${{ github.event.inputs.openwrt_version }}"
          BUILDER_ARCHIVE="openwrt-imagebuilder-${VERSION}-x86-64.Linux-x86_64.tar.zst"
          BUILDER_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${BUILDER_ARCHIVE}"
          echo "Downloading: ${BUILDER_URL}"
          wget -q --show-progress "${BUILDER_URL}" -O "${BUILDER_ARCHIVE}" || {
            echo "Failed to download ImageBuilder for version ${VERSION}"
            exit 1
          }
          tar -xf "${BUILDER_ARCHIVE}"
          BUILDER_DIR=$(find . -maxdepth 1 -mindepth 1 -type d -name "openwrt-imagebuilder-*-x86-64.Linux-x86_64" -printf '%f\n' -quit)
          [ -n "${BUILDER_DIR}" ] || { echo "ImageBuilder directory not found"; exit 1; }
          echo "BUILDER_DIR=${GITHUB_WORKSPACE}/${BUILDER_DIR}" >> $GITHUB_ENV
          echo "Image Builder ready: ${BUILDER_DIR}"

      - name: Prepare Third-party Packages (Optional)
        run: |
          cd "${{ env.BUILDER_DIR }}"
          mkdir -p packages

          # 自动获取 OpenClash 最新版 ipk
          OPENCLASH_URL=$(curl -fsSL https://api.github.com/repos/vernesong/OpenClash/releases/latest 2>/dev/null | grep -o 'https://[^"]*luci-app-openclash[^"]*\.ipk' | head -n 1 || true)
          if [ -n "${OPENCLASH_URL}" ]; then
            echo "Downloading OpenClash from: ${OPENCLASH_URL}"
            wget -q "${OPENCLASH_URL}" -P packages/ || true
          fi

          # 复制仓库 packages 目录下的本地 ipk（如有）
          if [ -d "${GITHUB_WORKSPACE}/repo/packages" ]; then
            cp -rf "${GITHUB_WORKSPACE}/repo/packages/"*.ipk packages/ 2>/dev/null || true
            echo "✅ Local ipk packages copied"
          fi

          # 若存在 script.sh 则以容错模式执行辅助准备脚本
          if [ -f "${GITHUB_WORKSPACE}/repo/script.sh" ]; then
            chmod +x "${GITHUB_WORKSPACE}/repo/script.sh"
            "${GITHUB_WORKSPACE}/repo/script.sh" || echo "⚠️ script.sh exited with warning"
          fi

      - name: Prepare Custom Files (Optional)
        run: |
          mkdir -p "${{ env.BUILDER_DIR }}/files"
          if [ -d "${GITHUB_WORKSPACE}/repo/files" ]; then
            cp -a "${GITHUB_WORKSPACE}/repo/files/." "${{ env.BUILDER_DIR }}/files/"
            rm -f "${{ env.BUILDER_DIR }}/files/.gitkeep"
            echo "✅ Custom files copied"
          fi

      - name: Build Firmware
        run: |
          cd "${{ env.BUILDER_DIR }}"

          # 1. 优先索引本地 packages 目录，并更新 ImageBuilder 仓库源索引
          make package_index 2>/dev/null || true
          make package_reload 2>/dev/null || true

          # 2. 收集所有可用软件包名称（包括远端官方源 + 本地 packages/ 目录）
          AVAILABLE_PACKAGES="$(make -s package_list 2>/dev/null | awk '{print $1}' | sort -u)"
          LOCAL_IPKS="$(find packages/ -maxdepth 1 -type f -name '*.ipk' -printf '%f\n' 2>/dev/null | sed -E 's/_[^_]+_[^_]+\.ipk$//' | sort -u)"
          ALL_AVAILABLE="$(echo -e "${AVAILABLE_PACKAGES}\n${LOCAL_IPKS}" | sort -u | grep -v '^$')"

          PACKAGES="${{ github.event.inputs.custom_packages }}"

          # 从仓库 .config 读取额外配置的包
          CONFIG_FILE="${GITHUB_WORKSPACE}/repo/.config"
          if [ -f "${CONFIG_FILE}" ]; then
            CONFIG_PACKAGES="$(awk -F= '/^CONFIG_PACKAGE_[a-zA-Z0-9][a-zA-Z0-9_.+-]*=y$/ { sub(/^CONFIG_PACKAGE_/, "", $1); if ($1 !~ /_INCLUDE_/) printf "%s ", $1 }' "${CONFIG_FILE}")"
            PACKAGES="${PACKAGES} ${CONFIG_PACKAGES}"
          fi

          VALID_PACKAGES=()
          SKIPPED_PACKAGES=()
          for PACKAGE in ${PACKAGES}; do
            # 关键：以 '-' 开头的排除指令（如 -dnsmasq, -libustream-mbedtls）一律保留
            if [[ "${PACKAGE}" == -* ]]; then
              VALID_PACKAGES+=("${PACKAGE}")
              continue
            fi

            # 如果成功获取到了可用包清单，则校验包名
            if [ -n "${ALL_AVAILABLE}" ]; then
              if grep -Fqx -- "${PACKAGE}" <<< "${ALL_AVAILABLE}"; then
                VALID_PACKAGES+=("${PACKAGE}")
              else
                SKIPPED_PACKAGES+=("${PACKAGE}")
              fi
            else
              VALID_PACKAGES+=("${PACKAGE}")
            fi
          done

          if [ "${#SKIPPED_PACKAGES[@]}" -gt 0 ]; then
            echo "⚠️ Skipping unavailable packages: ${SKIPPED_PACKAGES[*]}"
          fi

          PACKAGES="${VALID_PACKAGES[*]}"
          echo "📦 Installing packages: ${PACKAGES}"

          make image \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            EXTRA_IMAGE_NAME="custom-${{ env.BUILD_DATE }}" \
            ROOTFS_PARTSIZE=2048 \
            CONFIG_TARGET_ROOTFS_PARTSIZE=2048 \
            V=s

          echo "✅ Build completed!"

      - name: Generate Checksums & Organize Files
        run: |
          cd "${{ env.BUILDER_DIR }}/bin/targets/x86/64"
          sha256sum *.img.gz > sha256sums 2>/dev/null || true
          ls -lh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-x86_64-${{ env.BUILD_DATE }}
          path: |
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.img.gz
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.manifest
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/sha256sums
          retention-days: 7

      - name: Set Release Tag
        id: release_tag
        run: |
          echo "tag=openwrt-x86_64-${{ env.BUILD_DATE }}" >> $GITHUB_OUTPUT
          echo "name=OpenWrt x86_64 ImageBuilder-${{ env.BUILD_DATE }}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.img.gz
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/sha256sums
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.manifest
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          draft: false
          prerelease: false

      - name: Remove old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
