name: Build OpenWrt x86_64 (ImageBuilder)

on:
  workflow_dispatch:
    inputs:
      custom_packages:
        description: 'Custom Packages (space separated)'
        required: false
        default: >-
         base-files block-mount ca-bundle  -dnsmasq dnsmasq-full dropbear fdisk firewall4
         fstools grub2-bios-setup i915-firmware-dmc kmod-8139cp kmod-8139too
         kmod-button-hotplug kmod-e1000e kmod-fs-f2fs kmod-i40e kmod-igb
         kmod-igbvf kmod-igc kmod-ixgbe kmod-ixgbevf kmod-nf-nathelper
         kmod-nf-nathelper-extra kmod-nft-offload kmod-pcnet32 kmod-r8101
         kmod-r8125 kmod-r8126 kmod-r8168 kmod-tulip kmod-usb-hid kmod-usb-net
         kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-rtl8150
         kmod-usb-net-rtl8152 kmod-vmxnet3 libc libgcc -libustream-mbedtls libustream-openssl logd
         luci-app-package-manager luci-compat luci-lib-base luci-lib-ipkg
         luci-light mkf2fs mtd netifd nftables odhcp6c odhcpd-ipv6only opkg
         partx-utils ppp ppp-mod-pppoe procd-ujail uci uclient-fetch
         urandom-seed urngd kmod-amazon-ena kmod-amd-xgbe kmod-bnx2 kmod-e1000
         kmod-dwmac-intel kmod-forcedeth kmod-fs-vfat kmod-tg3 kmod-drm-i915

        
      include_docker:
        description: 'Include Docker?'
        type: boolean
        default: false


env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
 


      - name: Initialize Environment
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          sudo -E apt-get update
          sudo -E apt-get -y install $(curl -fsSL is.gd/depends_ubuntu_2204)
            
      - name: 合并磁盘 Disks
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: repo
          
      - name: Build source and ImageBuilder
        run: |
          REPO_DIR="${GITHUB_WORKSPACE}/repo"
          [ -f "${REPO_DIR}/script.sh" ] && [ -f "${REPO_DIR}/config.sh" ] || { echo "Repository scripts were not checked out"; exit 1; }
          cd "${GITHUB_WORKSPACE}"
          git clone --depth 1 "${REPO_URL}" -b "${REPO_BRANCH}" "${GITHUB_WORKSPACE}/openwrt"
          chmod +x "${REPO_DIR}/script.sh" "${REPO_DIR}/config.sh"
          "${REPO_DIR}/script.sh"
          cd "${GITHUB_WORKSPACE}/openwrt"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd "${GITHUB_WORKSPACE}"
          CONFIG_SOURCE="${REPO_DIR}/.config" "${REPO_DIR}/config.sh"
          cd "${GITHUB_WORKSPACE}/openwrt"
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
          make -j$(nproc) || make -j1 V=s

          BUILDER_ARCHIVE=$(find bin/targets/x86/64 -maxdepth 1 -type f -name '*imagebuilder*.tar.zst' -print -quit)
          [ -n "${BUILDER_ARCHIVE}" ] || { echo "ImageBuilder archive was not generated"; exit 1; }
          tar -xf "${BUILDER_ARCHIVE}"
          BUILDER_DIR=$(find . -maxdepth 1 -mindepth 1 -type d -name '*imagebuilder*-x86-64.Linux-x86_64' -printf '%f\n' -quit)
          [ -n "${BUILDER_DIR}" ] || { echo "ImageBuilder directory not found"; exit 1; }
          echo "BUILDER_DIR=$PWD/${BUILDER_DIR}" >> $GITHUB_ENV
          echo "Image Builder ready: ${BUILDER_DIR}"

      - name: Prepare Custom Files (Optional)
        run: |
          # 如果有自定义文件（如默认配置、脚本等），放到仓库的 files/ 目录下
          if [ -d "${GITHUB_WORKSPACE}/repo/files" ]; then
            cp -rf "${GITHUB_WORKSPACE}/repo/files/"* "${{ env.BUILDER_DIR }}/files/" 2>/dev/null || true
            echo "✅ Custom files copied"
          fi

      - name: Build Firmware
        run: |
          cd "${{ env.BUILDER_DIR }}"

          PACKAGES="${{ github.event.inputs.custom_packages }}"

          # Read additional packages from the repository-level .config file.
          # Only package selectors are used; package feature sub-options are ignored.
          CONFIG_FILE="${GITHUB_WORKSPACE}/repo/.config"
          if [ -f "${CONFIG_FILE}" ]; then
            CONFIG_PACKAGES="$(awk -F= '/^CONFIG_PACKAGE_[a-zA-Z0-9][a-zA-Z0-9_.+-]*=y$/ { sub(/^CONFIG_PACKAGE_/, "", $1); if ($1 !~ /_INCLUDE_/) printf "%s ", $1 }' "${CONFIG_FILE}")"
            PACKAGES="${PACKAGES} ${CONFIG_PACKAGES}"
          fi

          # 如果勾选了 Docker，追加相关包
          if [ "${{ github.event.inputs.include_docker }}" == "true" ]; then
            PACKAGES="${PACKAGES} docker dockerd luci-app-dockerd"
          fi

          echo "📦 Installing packages: ${PACKAGES}"

          make image \
            PACKAGES="${PACKAGES}" \
            FILES="files" \
            EXTRA_IMAGE_NAME="custom-${{ env.BUILD_DATE }}" \
            ROOTFS_PARTSIZE=2048
          echo "✅ Build completed!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-x86_64-${{ env.BUILD_DATE }}
          path: |
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.img.gz
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.efi.gz
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.manifest
          retention-days: 7

      - name: Set Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=OpenWrt x86_64 ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=openwrt-x86_64-${{ env.BUILD_DATE }}" >> $GITHUB_OUTPUT
            echo "name=OpenWrt x86_64 ImageBuilder-${{ env.BUILD_DATE }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.img.gz
            ${{ env.BUILDER_DIR }}/bin/targets/x86/64/*.efi.gz
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          draft: false
          prerelease: false
          
      - name: Remove old Releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true  #Whether to delete Releases (options: true/false). Default: false.是否删除 Releases（选项：true/false），默认为 false
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}   
